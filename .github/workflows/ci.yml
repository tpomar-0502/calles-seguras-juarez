name: CI - Lint y Pruebas Automatizadas

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar linter (Ruff)
        run: ruff check backend/app backend/tests --ignore E501

      - name: Ejecutar pruebas unitarias y de integración (Pytest)
        env:
          PYTHONPATH: backend
        run: pytest -v backend/tests